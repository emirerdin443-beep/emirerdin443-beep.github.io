<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="31chan, anonim imageboard topluluğu. /b/ rastgele, /g/ teknoloji, /v/ oyunlar, /m/ müzik ve /a/ sanat panolarını keşfet. Hesap veya kayıt gerekmez.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://31chan.de5.net/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="31chan">
  <meta property="og:title" content="31chan - Anonim Imageboard">
  <meta property="og:description" content="Hesap yok, kayıt yok. Rastgele, teknoloji, oyunlar, müzik ve sanat panolarını keşfet.">
  <meta property="og:url" content="https://31chan.de5.net/">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>31chan - Anonim Imageboard</title>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span>31chan</span></a>
  <button class="link" id="ownerRefreshBtn" type="button" title="Token değiştikten sonra Owner yetkisini yeniden kontrol et">Yetkiyi yenile</button>
  <button class="link" id="devtoolsBtn" type="button" title="Eruda DevTools">DevTools</button>
  <nav class="boardnav" id="boardNav" aria-label="Panolar"></nav>
  <label class="language-picker"><span data-i18n="Dil">Dil</span><select id="languageSelect" aria-label="Dil"><option value="tr">Türkçe</option><option value="en">English</option><option value="ru">Русский</option><option value="es">Español</option><option value="az">Azərbaycanca</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="zh">中文</option></select></label>
  <button class="link" id="themeBtn" type="button">Tema</button>
</header>
<main class="wrap" id="app">
  <p class="muted">Yükleniyor…</p>
</main>
<footer class="footer">
  31chan anonim bir imageboard'dur. Gönderiler ortak sunucu veritabanında saklanır ve diğer ziyaretçiler tarafından görülebilir.
</footer>
<script>
  (function () {
    const btn = document.getElementById('devtoolsBtn');
    btn.addEventListener('click', function () {
      if (window.eruda) { window.eruda.show(); return; }
      btn.disabled = true;
      btn.textContent = 'Yükleniyor…';
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/eruda';
      script.onload = function () {
        window.eruda.init();
        window.eruda.show();
        btn.disabled = false;
        btn.textContent = 'DevTools';
      };
      script.onerror = function () {
        btn.disabled = false;
        btn.textContent = 'DevTools';
        alert('Eruda yüklenemedi. İnternet bağlantısını kontrol et.');
      };
      document.head.appendChild(script);
    });
  })();
  </script>
  <script src="i18n.js?v=3"></script>
<script src="store.js?v=15"></script>
<script src="app.js?v=17"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=21', { updateViaCache: 'none' });</script>
</body>
</html>
