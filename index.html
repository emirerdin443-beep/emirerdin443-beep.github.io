<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Chatroom</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#e5e7eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#1e293b,#0b1020 65%)}main{width:min(760px,100%);background:#111827;border:1px solid #334155;border-radius:18px;overflow:hidden;box-shadow:0 24px 80px #0006}.top{padding:22px 24px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:1.25rem;margin:0}.muted{color:#94a3b8;font-size:.9rem}.panel{padding:22px}label{display:block;color:#cbd5e1;font-size:.9rem;margin-bottom:8px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #475569}input{width:100%;background:#0b1220;color:#f8fafc;margin-bottom:12px}button{cursor:pointer;background:#2563eb;border-color:#2563eb;color:white;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#1f2937;border-color:#475569}.row{display:flex;gap:10px}.row input{flex:1;min-width:0}.hidden{display:none!important}#messages{height:min(54vh,480px);min-height:220px;overflow:auto;padding:14px;background:#0b1220;border:1px solid #334155;border-radius:12px;display:flex;flex-direction:column;gap:10px}.msg{padding:10px 12px;border-radius:10px;background:#172033;overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:#94a3b8;margin-bottom:5px}.body{white-space:pre-wrap}.status{min-height:1.3em;color:#93c5fd;font-size:.88rem;margin:10px 0 0}.composer{margin-top:12px}.foot{padding:0 22px 18px;color:#94a3b8;font-size:.8rem}.danger{color:#fca5a5}button:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}@media(max-width:520px){.top,.panel{padding:16px}.row{flex-direction:column}.row button{width:100%}}
</style></head>
<body><main>
<header class="top"><div><h1>Chatroom</h1><div class="muted">Özel sohbet&iletişim ağı</div></div><button id="logout" class="secondary hidden">Çıkış</button></header>
<section id="login" class="panel"><h2>Odaya giriş</h2><label for="password">Oda şifresi</label><input id="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="128" placeholder="Şifreyi gir"><button id="loginBtn">Giriş yap</button><p id="loginStatus" class="status" role="status"></p></section>
<section id="room" class="panel hidden"><div class="row" style="margin-bottom:12px"><div style="flex:1"><label for="nickname">Görünen ad</label><input id="nickname" maxlength="24" autocomplete="nickname" placeholder="Adın"></div></div><div id="messages" aria-live="polite"></div><form id="sendForm" class="composer"><label for="message">Mesaj</label><div class="row"><input id="message" maxlength="1000" autocomplete="off" placeholder="Mesaj yaz..." required><button id="sendBtn">Gönder</button></div></form><p id="roomStatus" class="status" role="status"></p></section>
<footer class="foot">Mesajlar sunucudaki veritabanında saklanır. Özel şifreyi yalnızca güvendiğin kişilerle paylaş.</footer>
</main>
<script>
const API="https://chatroom-api.emirerdin443.workers.dev";
const $=id=>document.getElementById(id);let token=localStorage.getItem("chatroom-session"),poller=null,lastId=0;
async function api(path,opts={}){const headers={"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opts.headers||{})};const r=await fetch(API+path,{...opts,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||"İstek başarısız ("+r.status+")");return data}
function setStatus(id,msg,error=false){$(id).textContent=msg;$(id).classList.toggle("danger",error)}
function showRoom(){ $("login").classList.add("hidden");$("room").classList.remove("hidden");$("logout").classList.remove("hidden");loadMessages();if(poller)clearInterval(poller);poller=setInterval(loadMessages,4000)}
function showLogin(){if(poller)clearInterval(poller);$("room").classList.add("hidden");$("logout").classList.add("hidden");$("login").classList.remove("hidden")}
async function login(){const password=$("password").value;if(!password){setStatus("loginStatus","Şifreyi gir.",true);return} $("loginBtn").disabled=true;setStatus("loginStatus","Kontrol ediliyor…");try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({password})});token=d.token;localStorage.setItem("chatroom-session",token);$("password").value="";setStatus("loginStatus","");showRoom()}catch(e){setStatus("loginStatus",e.message,true)}finally{$("loginBtn").disabled=false}}
async function loadMessages(){try{const d=await api("/api/messages");const box=$("messages");const oldScroll=box.scrollTop+box.clientHeight>=box.scrollHeight-30;for(const m of d.messages){if(m.id<=lastId)continue;const item=document.createElement("article");item.className="msg";const meta=document.createElement("div");meta.className="meta";const who=document.createElement("strong");who.textContent=m.name;const when=document.createElement("span");when.textContent=new Date(m.created_at.replace(" ","T")+"Z").toLocaleString();meta.append(who,when);const body=document.createElement("div");body.className="body";body.textContent=m.body;item.append(meta,body);box.append(item);lastId=Math.max(lastId,m.id)}while(box.children.length>150)box.removeChild(box.firstChild);if(oldScroll)box.scrollTop=box.scrollHeight;setStatus("roomStatus","Bağlı")}catch(e){if(/session|unauthorized|expired/i.test(e.message)){token=null;localStorage.removeItem("chatroom-session");showLogin()}setStatus("roomStatus",e.message,true)}}
$("loginBtn").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logout").addEventListener("click",()=>{token=null;localStorage.removeItem("chatroom-session");lastId=0;$("messages").replaceChildren();showLogin()});
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();const body=$("message").value.trim(),name=$("nickname").value.trim()||"Misafir";if(!body)return;$("sendBtn").disabled=true;try{await api("/api/messages",{method:"POST",body:JSON.stringify({name,body})});$("message").value="";await loadMessages();$("message").focus()}catch(e){setStatus("roomStatus",e.message,true)}finally{$("sendBtn").disabled=false}});
if(token)showRoom();
</script></body></html>
